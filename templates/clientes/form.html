{% extends 'base.html' %}{% block title %}{{ titulo }}{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><a href="{% url 'lista_clientes' %}">← Voltar aos clientes</a><div class="card mt-3"><div class="card-body p-4"><h1 class="h3 mb-4">{{ titulo }}</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Salvar cliente</button><a class="btn btn-outline-secondary" href="{% url 'lista_clientes' %}">Cancelar</a></form></div></div></div></div>{% endblock %}
