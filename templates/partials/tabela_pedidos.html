<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Nº</th><th>Cliente</th><th>Descrição</th><th>Prazo</th><th>Status</th><th></th></tr></thead><tbody>{% for pedido in pedidos %}<tr><td>#{{ pedido.pk }}</td><td>{{ pedido.cliente.nome }}</td><td>{{ pedido.descricao|truncatechars:55 }}</td><td>{{ pedido.prazo_previsto|date:'d/m/Y' }}</td><td><span class="badge text-bg-light">{{ pedido.get_status_display }}</span></td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'editar_pedido' pedido.pk %}">Abrir</a></td></tr>{% empty %}<tr><td colspan="6" class="text-center text-secondary py-4">Nenhum pedido cadastrado.</td></tr>{% endfor %}</tbody></table></div>
