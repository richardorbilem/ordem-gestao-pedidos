{% extends 'base.html' %}{% block title %}Entrar{% endblock %}{% block content %}<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-1">ORDEM</h1><p class="text-secondary mb-4">Gestão de pedidos para móveis planejados</p><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}<div class="mb-3"><label class="form-label" for="id_username">Usuário</label><input class="form-control" id="id_username" name="username" required autofocus></div><div class="mb-3"><label class="form-label" for="id_password">Senha</label><input class="form-control" id="id_password" name="password" type="password" required></div><button class="btn btn-primary w-100">Entrar</button></form></div></div></div></div>{% endblock %}
